<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=devive-width, initial-scale=1">

    <title>My portfolio</title>

    <link rel="stylesheet" href="css/style.css">

    <script src = "js/main.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <a href="#hero">portfolio</a>

            <ul>
                <li><a href="#about">About</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="about">
        <h2>About Me</h2>

        <img
            src="images/profile.jpg"
            alt="프로필 사진"
        >

        <p>
            안녕하세요. 웹 개발을 공부하고 있는 엄준식입니다.
        </p>
    </section>

    <section id="Skills">
        <h2>Skills</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </section>

    <section id="projects">
        <h2>Projects</h2>

        <div id="projects-container">
            <p>프로젝트를 불러올 예정입니다.</p>
        </div>
    </section>

    <section id="contact">
        <h2>Contact</h2>

        <form id="contact-form">
            <div>
                <label for="name">이름</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                >
            </div>

            <div>
                <label for="email">이메일</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                >
            </div>

            <div>
                <label for="message">메시지</label>
                <textarea
                    id="message"
                    name="message"
                ></textarea>
            </div>

            <button type="submit">
                보내기
            </button>

        </form>
    </section>
</body>
</html>
