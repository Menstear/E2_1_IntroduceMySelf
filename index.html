<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Portfolio</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header class="header">
        <nav class="nav">

            <a href="#hero" class="logo">
                Portfolio
            </a>

            <ul id="nav-menu" class="nav-menu">
                <li>
                    <a href="#about" class="nav-link">About</a>
                </li>
                <li>
                    <a href="#skills" class="nav-link">Skills</a>
                </li>
                <li>
                    <a href="#projects" class="nav-link">Projects</a>
                </li>
                <li>
                    <a href="#contact" class="nav-link">Contact</a>
                </li>
            </ul>

            <button
                class="theme-button"
                type="button"
                aria-label="다크 모드로 전환"
            >
                🌙
            </button>

            <button
                class="menu-button"
                type="button"
                aria-label="메뉴 열기"
                aria-controls="nav-menu"
                aria-expanded="false"
            >
                ☰
            </button>

        </nav>
    </header>


    <!-- Main -->
    <main>

        <!-- Hero -->
        <section id="hero" class="hero">

            <h1 class="hero-title">
                안녕하세요. 엄준식입니다.
            </h1>

            <p class="hero-description">
                웹 개발을 공부하고 있습니다.
            </p>

            <div class="hero-buttons">
                <a href="#projects" class="button">
                    프로젝트 보기
                </a>

                <a href="#contact" class="button">
                    연락하기
                </a>
            </div>

        </section>


        <!-- About -->
        <section id="about" class="section">

            <h2 class="section-title">
                About Me
            </h2>

            <div class="about-content">

                <img
                    src="images/profile.jpg"
                    alt="엄준식의 프로필 사진"
                    class="profile-image"
                >

                <p class="about-description">
                    안녕하세요.
                    웹 개발을 공부하고 있는 엄준식입니다.
                </p>

            </div>

        </section>


        <!-- Skills -->
        <section id="skills" class="section">

            <h2 class="section-title">
                Skills
            </h2>

            <ul class="skills-list">
                <li class="skill-item">HTML</li>
                <li class="skill-item">CSS</li>
                <li class="skill-item">JavaScript</li>
            </ul>

        </section>


        <!-- Projects -->
        <section id="projects" class="section">

            <h2 class="section-title">
                Projects
            </h2>

            <div
                id="projects-container"
                class="projects-grid"
            >
                <p>
                    프로젝트를 불러올 예정입니다.
                </p>
            </div>

        </section>


        <!-- Contact -->
        <section id="contact" class="section">

            <h2 class="section-title">
                Contact
            </h2>

            <form
                id="contact-form"
                class="contact-form"
            >

                <div class="form-group">
                    <label for="name">
                        이름
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                    >
                </div>


                <div class="form-group">
                    <label for="email">
                        이메일
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                    >
                </div>


                <div class="form-group">
                    <label for="message">
                        메시지
                    </label>

                    <textarea
                        id="message"
                        name="message"
                    ></textarea>
                </div>


                <button
                    type="submit"
                    class="button"
                >
                    보내기
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 엄준식. All rights reserved.
        </p>

        <a
            href="https://github.com/"
            target="_blank"
            rel="noopener noreferrer"
            class="footer-link"
        >
            GitHub
        </a>

    </footer>


    <!-- Scroll Top Button -->
    <button
        id="scroll-top"
        class="scroll-top"
        type="button"
        aria-label="페이지 맨 위로 이동"
    >
        ↑
    </button>

</body>
</html>
